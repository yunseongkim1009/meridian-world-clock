<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#131a2c"/>
    </linearGradient>
    <radialGradient id="glow1" cx="82%" cy="0%" r="60%">
      <stop offset="0" stop-color="#b892ff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#b892ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0%" cy="100%" r="60%">
      <stop offset="0" stop-color="#6ea8fe" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#6ea8fe" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ea8fe"/>
      <stop offset="1" stop-color="#b892ff"/>
    </linearGradient>
    <linearGradient id="day" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a86ff"/><stop offset="1" stop-color="#bfe0ff"/>
    </linearGradient>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#28305a"/><stop offset="0.5" stop-color="#7d4a86"/><stop offset="1" stop-color="#e0705a"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0f24"/><stop offset="1" stop-color="#141a3a"/>
    </linearGradient>
    <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a5a"/><stop offset="0.5" stop-color="#e0736b"/><stop offset="1" stop-color="#f0a868"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="440" fill="url(#bg)"/>
  <rect width="1280" height="440" fill="url(#glow1)"/>
  <rect width="1280" height="440" fill="url(#glow2)"/>

  <!-- Brand -->
  <g transform="translate(72,70)">
    <rect width="64" height="64" rx="18" fill="url(#logo)"/>
    <g stroke="#0b0f1a" stroke-width="5" stroke-linecap="round" transform="translate(32,32)">
      <line x1="0" y1="0" x2="0" y2="-20"/>
      <line x1="0" y1="0" x2="14" y2="6"/>
    </g>
    <text x="86" y="30" fill="#f2f5ff" font-size="42" font-weight="800" letter-spacing="-1">Meridian</text>
    <text x="88" y="58" fill="#8b93ad" font-size="19" font-weight="600">World clocks, your way</text>
  </g>

  <!-- Tagline -->
  <text x="72" y="212" fill="#f2f5ff" font-size="30" font-weight="700">Four clock styles · 44 cities · live day/night · meeting planner · fullscreen</text>
  <g font-size="16" font-weight="700">
    <rect x="72"  y="244" width="132" height="34" rx="17" fill="rgba(110,168,254,0.15)" stroke="#6ea8fe" stroke-opacity="0.4"/>
    <text x="138" y="266" fill="#6ea8fe" text-anchor="middle">🔢 Digital</text>
    <rect x="216" y="244" width="132" height="34" rx="17" fill="rgba(184,146,255,0.15)" stroke="#b892ff" stroke-opacity="0.4"/>
    <text x="282" y="266" fill="#b892ff" text-anchor="middle">🕐 Analog</text>
    <rect x="360" y="244" width="112" height="34" rx="17" fill="rgba(82,214,164,0.15)" stroke="#52d6a4" stroke-opacity="0.4"/>
    <text x="416" y="266" fill="#52d6a4" text-anchor="middle">🎰 Flip</text>
    <rect x="484" y="244" width="120" height="34" rx="17" fill="rgba(240,168,104,0.15)" stroke="#f0a868" stroke-opacity="0.4"/>
    <text x="544" y="266" fill="#f0a868" text-anchor="middle">💬 Word</text>
  </g>

  <!-- Mini clock cards -->
  <g transform="translate(760,96)" font-family="ui-monospace,'SF Mono',Menlo,monospace">
    <!-- Card: New York (dawn) -->
    <g transform="translate(0,0)">
      <rect width="220" height="120" rx="18" fill="url(#dawn)" fill-opacity="0.45" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="18" y="34" font-family="-apple-system,sans-serif" font-size="16" font-weight="700" fill="#fff">🇺🇸 New York</text>
      <text x="18" y="88" font-size="38" font-weight="700" fill="#fff">06:24</text>
      <text x="150" y="88" font-size="16" fill="#ffffff" fill-opacity="0.7">AM</text>
    </g>
    <!-- Card: London (day) -->
    <g transform="translate(236,0)">
      <rect width="220" height="120" rx="18" fill="url(#day)" fill-opacity="0.42" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="18" y="34" font-family="-apple-system,sans-serif" font-size="16" font-weight="700" fill="#fff">🇬🇧 London</text>
      <text x="18" y="88" font-size="38" font-weight="700" fill="#fff">11:24</text>
      <text x="150" y="88" font-size="16" fill="#ffffff" fill-opacity="0.8">AM</text>
    </g>
    <!-- Card: Tokyo (night) analog -->
    <g transform="translate(0,140)">
      <rect width="220" height="120" rx="18" fill="url(#night)" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="18" y="34" font-family="-apple-system,sans-serif" font-size="16" font-weight="700" fill="#fff">🇯🇵 Tokyo</text>
      <g transform="translate(150,68)">
        <circle r="34" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.15"/>
        <line x1="0" y1="0" x2="0" y2="-18" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        <line x1="0" y1="0" x2="16" y2="8" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
        <line x1="0" y1="0" x2="-6" y2="24" stroke="#6ea8fe" stroke-width="1.4" stroke-linecap="round"/>
        <circle r="2.6" fill="#6ea8fe"/>
      </g>
      <text x="18" y="96" font-family="-apple-system,sans-serif" font-size="13" fill="#ffffff" fill-opacity="0.6">🌙 Night · 8:24 PM</text>
    </g>
    <!-- Card: Sydney (dusk) -->
    <g transform="translate(236,140)">
      <rect width="220" height="120" rx="18" fill="url(#dusk)" fill-opacity="0.5" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="18" y="34" font-family="-apple-system,sans-serif" font-size="16" font-weight="700" fill="#fff">🇦🇺 Sydney</text>
      <text x="18" y="88" font-size="38" font-weight="700" fill="#fff">09:24</text>
      <text x="150" y="88" font-size="16" fill="#ffffff" fill-opacity="0.8">PM</text>
    </g>
  </g>
</svg>
